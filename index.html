                    btn.textContent = this.currentProblem.options[i];
                });
            }
            
            handleMathAnswer(selectedIndex) {
                this.mathAttempts++;
                
                const correct = selectedIndex === this.currentProblem.correctIndex;
                this.lastAnswerCorrect = correct;
                
                if (correct) {
                    this.mathCorrect++;
                    this.streak++;
                    this.bestStreak = Math.max(this.bestStreak, this.streak);
                    
                    // Award points
                    const points = this.isOnFire ? 3 : 2;
                    this.playerScore += points;
                    
                    // Check for fire mode
                    if (this.streak >= CONFIG.STREAK_FOR_FIRE && !this.isOnFire) {
                        this.isOnFire = true;
                        document.getElementById('streakIndicator').style.display = 'block';
                    }
                    
                    // Time bonus for Elo
                    const elapsed = (performance.now() - this.mathStartTime) / 1000;
                    const timeBonus = Math.max(0, (CONFIG.MATH_TIME_LIMIT - elapsed) * 2);
                    this.mathGen.updateElo(true, timeBonus);
                    
                    this.audio.playCorrect();
                } else {
                    this.streak = 0;
                    this.isOnFire = false;
                    document.getElementById('streakIndicator').style.display = 'none';
                    
                    this.mathGen.updateElo(false);
                    this.audio.playWrong();
                }
                
                // Transition to feedback
                const gameplayState = this.stateMachine.children.get('Gameplay');
                gameplayState.transition(this, 'FeedbackSub');
            }
            
            createShotArc(startX, startY, made) {
                const points = this.physics.calculateTrajectory(
                    startX, startY,
                    CONFIG.HOOP_X - CONFIG.RIM_RADIUS,
                    CONFIG.HOOP_HEIGHT,
                    0.7
                );
                
                this.shotArcs.push({
                    points,
                    progress: 0,
                    made
                });
            }
            
            updateUI() {
                document.getElementById('playerScore').textContent = this.playerScore;
                document.getElementById('aiScore').textContent = this.aiScore;
                document.getElementById('gameTimer').textContent = Math.ceil(this.gameTimer);
            }
            
            render(alpha) {
                this.renderer.clear();
                
                // Always draw court and hoop
                this.renderer.drawCourt();
                this.renderer.drawHoop();
                
                // Only render game objects during gameplay
                const currentState = this.stateMachine.currentChild;
                if (currentState && currentState.name === 'Gameplay') {
                    // Draw shot arcs
                    for (const arc of this.shotArcs) {
                        this.renderer.drawShotArc(arc.points, arc.progress);
                    }
                    
                    // Get interpolated positions
                    const playerT = this.player.getComponent(Transform);
                    const aiT = this.aiPlayer.getComponent(Transform);
                    const ballT = this.ball.getComponent(Transform);
                    
                    // Determine facing direction
                    const playerFacing = ballT.x > playerT.x;
                    const aiFacing = CONFIG.HOOP_X > aiT.x;
                    
                    // Z-sort entities for painter's algorithm
                    const entities = [
                        { type: 'player', y: playerT.y, data: { t: playerT, facing: playerFacing } },
                        { type: 'ai', y: aiT.y, data: { t: aiT, facing: aiFacing } },
                        { type: 'ball', y: ballT.y, data: { t: ballT } }
                    ];
                    
                    entities.sort((a, b) => a.y - b.y);
                    
                    for (const entity of entities) {
                        if (entity.type === 'player') {
                            // Fire effect
                            if (this.isOnFire) {
                                this.renderer.drawFireEffect(entity.data.t.x, entity.data.t.y);
                            }
                            this.renderer.drawPlayer(
                                entity.data.t.x, 
                                entity.data.t.y, 
                                '#e94560', 
                                true, 
                                entity.data.facing
                            );
                        } else if (entity.type === 'ai') {
                            this.renderer.drawPlayer(
                                entity.data.t.x, 
                                entity.data.t.y, 
                                '#4361ee', 
                                false, 
                                entity.data.facing
                            );
                        } else if (entity.type === 'ball') {
                            const rotation = this.ballInFlight 
                                ? performance.now() / 100 
                                : 0;
                            this.renderer.drawBall(
                                entity.data.t.x, 
                                entity.data.t.y, 
                                entity.data.t.z,
                                rotation
                            );
                        }
                    }
                }
            }
        }

        // ========================================================================
        // INITIALIZATION
        // ========================================================================
        
        window.addEventListener('DOMContentLoaded', () => {
            window.game = new MathHoopsGame();
        });

    })();
    </script>
